<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>plain control page</title>
    <style>
      body { margin: 0; font-family: -apple-system, system-ui, sans-serif; }
      .band { height: 20px; font: 700 12px/20px monospace; color: #fff; padding-left: 6px; }
      .d { position: absolute; left: 0; width: 50%; background: #0a3069; }
      .d.alt { background: #1f6feb; }
      .v { position: fixed; right: 0; width: 50%; background: #0b4f22; }
      .v.alt { background: #1a7f37; }
      pre { margin: 0; padding: 12px; font-size: 12px; line-height: 1.6; white-space: pre-wrap; word-break: break-all; }
    </style>
  </head>
  <body>
    <div class="band d" style="top: 0">D0</div>
    <div class="band d alt" style="top: 20px">D20</div>
    <div class="band d" style="top: 40px">D40</div>
    <div class="band d alt" style="top: 60px">D60</div>
    <div class="band d" style="top: 80px">D80</div>
    <div class="band d alt" style="top: 100px">D100</div>
    <div class="band d" style="top: 120px">D120</div>
    <div class="band d alt" style="top: 140px">D140</div>
    <div class="band d" style="top: 160px">D160</div>

    <div class="band v" style="top: 0">V0</div>
    <div class="band v alt" style="top: 20px">V20</div>
    <div class="band v" style="top: 40px">V40</div>
    <div class="band v alt" style="top: 60px">V60</div>
    <div class="band v" style="top: 80px">V80</div>
    <div class="band v alt" style="top: 100px">V100</div>
    <div class="band v" style="top: 120px">V120</div>
    <div class="band v alt" style="top: 140px">V140</div>
    <div class="band v" style="top: 160px">V160</div>

    <div style="height: 190px"></div>
    <div style="background: #ff0000; color: #fff; font-size: 24px; font-weight: 700; padding: 12px">
      PLAIN PAGE — NO FRAMEWORK
    </div>
    <pre id="out">…</pre>
    <div style="height: 1200px"></div>

    <script>
      function measureInset(name) {
        var p = document.createElement("div");
        p.style.cssText = "position:absolute;visibility:hidden;height:env(" + name + ", 0px)";
        document.body.appendChild(p);
        var h = p.getBoundingClientRect().height;
        p.remove();
        return h;
      }
      function collect() {
        var vv = window.visualViewport;
        document.getElementById("out").textContent = [
          "เวลา: " + new Date().toLocaleTimeString(),
          "scrollY: " + window.scrollY,
          "innerHeight: " + window.innerHeight,
          "docEl clientHeight: " + document.documentElement.clientHeight,
          "docEl scrollHeight: " + document.documentElement.scrollHeight,
          "screen: " + screen.width + " x " + screen.height,
          vv ? "visualViewport: h=" + vv.height + " offsetTop=" + vv.offsetTop + " scale=" + vv.scale : "no visualViewport",
          "safe-area-inset-top: " + measureInset("safe-area-inset-top"),
          "safe-area-inset-bottom: " + measureInset("safe-area-inset-bottom"),
          "viewport meta: " + (document.querySelector('meta[name=viewport]') || {}).content,
        ].join("\n");
      }
      collect();
      setTimeout(collect, 500);
      window.addEventListener("scroll", collect, { passive: true });
    </script>
  </body>
</html>
